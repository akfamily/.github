name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你想解决什么问题？现在的做法有什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望它如何工作？如涉及数据源，请附上来源网址。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充
      description: 考虑过的替代方案、参考资料等。
